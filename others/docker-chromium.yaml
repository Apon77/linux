#docker run -d --name=chromium -p 5800:5800 -e "WEB_FILE_MANAGER=1" -v ~/docker/appdata/chromium:/config:rw jlesage/chromium
#now access ip:5800 from browser to access docker chromium

version: '3'
services:
  chromium:
    image: jlesage/chromium
    ports:
      - "5800:5800"
      #- "5900:5900"
    volumes:
      - "~/docker/appdata/chromium:/config:rw"
    environment:
      - WEB_FILE_MANAGER=1
